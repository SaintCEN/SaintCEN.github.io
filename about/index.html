    <script src="https://cdnjs.cloudflare.com/ajax/libs/clipboard.js/2.0.0/clipboard.min.js"></script>
    <script>
      (function () {
      var scope = window.MinosPage.scope;
      $(document).ready(function () {
        if (!scope.active) return;
        $('figure.hljs, .article-entry pre').filter(function () {
          return this.matches('figure.hljs') || !$(this).closest('figure.hljs').length;
        }).each(function(i, figure) {
          var codeId = 'code-' + i;
          var code = figure.querySelector('.code, code');
          if (!code) return;
          var copyButton = $('<button>Copy <i class="far fa-clipboard"></i></button>');
          code.id = codeId;
          copyButton.addClass('clipboard-btn');
          copyButton.attr('data-clipboard-target-id', codeId);

          var figcaption = figure.querySelector('figcaption');

          if (figcaption) {
            figcaption.append(copyButton[0]);
          } else {
            figure.prepend(copyButton[0]);
          }
        })

        var clipboard = new ClipboardJS('.clipboard-btn', {
          target: function(trigger) {
            return document.getElementById(trigger.getAttribute('data-clipboard-target-id'));
          }
        });
        scope.cleanup(function () { clipboard.destroy(); });
        clipboard.on('success', function(e) {
          e.clearSelection();
        })
      })
      })();
    </script>
